install:
  commands:
    - [npm, ci]
build:
  commands:
    - [npm, run, build]
run:
  command: [node, .next/standalone/server.js]
artifacts:
  - src: ".next/standalone/**"
    dest: "."
  - src: ".next/static/**"
    dest: ".next/static"
  - src: "public/**"
    dest: "public"
profile:
  label: Baby Mart Supplier Platform
  description: Retail collaboration platform for supplier-retailer data sharing
